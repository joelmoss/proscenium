name: main
on:
  push:
    branches: [master]
    # A change to docs alone runs nothing. The app guide is the exception: test/proxy_rule_test.rb
    # runs its nginx rule through real nginx. The last matching pattern wins.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE.txt'
      - 'docs/guides/rubygem_npm_dependencies.md'
  pull_request:
    # As for push.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE.txt'
      - 'docs/guides/rubygem_npm_dependencies.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Nothing here writes to the repository, and every job runs dependency code - gems, Go modules,
# the dummy app's node_modules - so the token gets read access only, and checkout does not leave
# it in .git/config for that code to find.
permissions:
  contents: read

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: off
    steps:
      # The fixture tree under fixtures/dummy/node_modules is 24 tracked symlinks, all pointing
      # at directories, and most of what the resolver tests exercise routes through them. Git for
      # Windows defaults core.symlinks to false, which checks them out as text files holding
      # their target path - the tests then fail for a reason that has nothing to do with the code
      # under test. `symlink=dir` in .gitattributes is the other half: Git for Windows picks file
      # or directory symlinks per link, and a file symlink to a directory cannot be traversed.
      #
      # longpaths because the deepest tracked path is 185 characters and the runner's workspace
      # prefix takes it to roughly 212, which is close enough to the 260 limit to matter.
      #
      # autocrlf because the runner defaults it on, and the fixtures are test data: a CRLF
      # checkout changes their bytes, and esbuild's chunk hash is built from file contents. Every
      # other assertion here compares code through a whitespace-normalising matcher and cannot
      # see the difference, so it surfaced as one chunk name disagreeing and nothing else.
      - name: Windows checkout needs symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - run: go test ./test ./internal/...

  ruby-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rails: [rails_7.2, rails_8, rails_8.1]
        # Rails-version differences are OS-independent; OS differences are the Go shared library
        # and FFI, which go-test and bun-test already cover on macOS. One macOS Rails job is
        # enough, and it keeps the run under the macOS runner concurrency cap. One Windows cell
        # for the same reason, and because Windows runners are the slowest of the three.
        exclude:
          - os: macos-latest
            rails: rails_7.2
          - os: macos-latest
            rails: rails_8
          - os: windows-latest
            rails: rails_7.2
          - os: windows-latest
            rails: rails_8
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
      # Point Bundler straight at the Appraisal gemfile so setup-ruby installs and caches only
      # that one, instead of `appraisal install` resolving every gemfile uncached on every run.
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails }}.gemfile
    steps:
      # See the note in go-test: the fixture symlinks do not survive a default Windows checkout.
      - name: Windows checkout needs symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v7

        with:

          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - if: runner.os != 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go
      - if: runner.os == 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium.dll main.go

      # The narrowest check that the FFI boundary works on this platform: open the compiled
      # library and attach every exported function, and nothing else. Deliberately before
      # bin/test, which boots a Rails app - anything broken in a third-party gem there masks
      # this, as sqlite3's native extension once did on Windows. Requiring
      # proscenium first because builder.rb needs Proscenium::Error at class-definition time.
      #
      # Failing on the pin warning as well, because builder.rb only warns - a user should not lose
      # their app over it - and a warning nobody reads is how a failed pin would go unnoticed.
      - name: The compiled library loads
        shell: bash
        run: |
          # `|| status=$?`, because the step runs under `bash -e`: a bare failing assignment would
          # exit before the echo, and the load error would never reach the log.
          status=0
          out=$(bundle exec ruby -Ilib -rpathname -e '
            require "proscenium"
            require "proscenium/builder"
            puts "FFI OK, loaded #{Proscenium::Builder::LIBRARY_PATH}"
          ' 2>&1) || status=$?
          echo "$out"
          [ "$status" -eq 0 ] || exit "$status"
          if grep -q "could not pin" <<<"$out"; then exit 1; fi

      # Windows only, and not a formality: ffi calls FreeLibrary on the Go library during VM
      # teardown, which used to segfault the interpreter on roughly three runs in five. The
      # module pin in builder.rb is what stops it, and a flaky crash needs repetition to catch -
      # a single run passing proves nothing. See the comment above the pin.
      - name: The interpreter exits cleanly with the library loaded
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            bundle exec ruby -Ilib -e 'require "proscenium"; require "proscenium/builder"'
            echo "run $i exited $?"
          done

      - run: bin/test
        shell: bash

  # #154's end-to-end suites against real managers: their native behaviour the CLI relies on,
  # `proscenium install` and the adopted app. Stage D qualification runs them on every host the gem
  # ships for. They reach npm and GitHub until the hermetic registry exists. The fixture gems are
  # in test/package_manager/stage_a/ (see its README).
  package-manager:
    # A hang must fail the run, not hold a runner for the default six hours. The Windows leg runs
    # the install suite twice, the second time as a standard user.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Stage D qualifies Ruby 4.0: its legs run the whole suite, the default legs the
        # package-manager suites.
        ruby: [default, '4.0']
        # The capability table's pnpm line: every leg runs the floor of the first; one Linux leg
        # also runs the second, so a pull request sees pnpm 12 without waiting for the canary.
        pnpm_line: [0]
        include:
          - os: ubuntu-latest
            ruby: default
            pnpm_line: 1
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
      STAGE_A: 1
    steps:
      # See the note in go-test: the fixture symlinks do not survive a default Windows checkout.
      - name: Windows checkout needs symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The versions come from the CLI's capability table, the one source of truth for what
      # Proscenium supports: a line's `ci` is the floor CI runs. PROSCENIUM_PNPM makes the test
      # apps pin the same pnpm.
      - name: Manager versions from the capability table
        id: caps
        shell: bash
        run: |
          caps=lib/proscenium/cli/capabilities.json
          pnpm=$(jq -r '.managers.pnpm.lines[${{ matrix.pnpm_line }}].ci' "$caps")
          echo "pnpm=$pnpm" >> "$GITHUB_OUTPUT"
          echo "PROSCENIUM_PNPM=$pnpm" >> "$GITHUB_ENV"
          echo "bun=$(jq -r '.managers.bun.lines[0].ci' "$caps")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.caps.outputs.pnpm }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.caps.outputs.bun }}

      # test/proxy_rule_test.rb runs the guide's nginx rule through real nginx (C54).
      - if: runner.os == 'Linux'
        run: command -v nginx || (sudo apt-get update -q && sudo apt-get install -yq nginx-light)

      - if: runner.os != 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go
      - if: runner.os == 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium.dll main.go
      # Verbose, so the log names each test as it runs: a hang otherwise shows only as dots.
      - if: matrix.ruby == 'default' && matrix.pnpm_line == 0
        run: bin/test -v test/cli/git_scripts_test.rb test/bun_layout_test.rb test/pnpm_layout_test.rb test/cli/install_test.rb test/cli/spec_kinds_test.rb test/adopted/ test/proxy_rule_test.rb
        shell: bash
      # fixtures/adopted is a committed app that pins pnpm 11 itself, so the pnpm 12 leg skips it.
      - if: matrix.pnpm_line == 1
        run: bin/test -v test/cli/git_scripts_test.rb test/bun_layout_test.rb test/pnpm_layout_test.rb test/cli/install_test.rb test/cli/spec_kinds_test.rb
        shell: bash
      - if: matrix.ruby == '4.0'
        run: bin/test -v
        shell: bash
      # #154's C28: an ordinary Windows user. The runner is an administrator, so the install suite
      # runs again as a standard user created here, with Developer Mode off, so the user cannot
      # create a symbolic link either (the launcher proves that before the suite runs). The user
      # gets its own profile, so the managers start with empty caches of their own.
      - name: Install suite as a standard Windows user
        if: runner.os == 'Windows' && matrix.ruby == 'default' && matrix.pnpm_line == 0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'psmuser'
          # At most 14 characters: net user stops to ask about a longer one.
          $password = 'Ps1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          net user $user $password /add /y | Out-Null
          $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Force $unlock | Out-Null
          Set-ItemProperty $unlock AllowDevelopmentWithoutDevLicense 0
          # Read access to the checkout and the tools. A tool installed under the runner's own
          # profile, which other users cannot read, gets it on its top directory there.
          $dirs = @($env:GITHUB_WORKSPACE)
          foreach ($tool in 'ruby', 'pnpm', 'bun') {
            $path = (Get-Command $tool).Source
            Write-Host "$tool at $path"
            if ($path.StartsWith("$env:USERPROFILE\")) {
              $dirs += Join-Path $env:USERPROFILE $path.Substring($env:USERPROFILE.Length + 1).Split('\')[0]
            } else {
              $dirs += Split-Path (Split-Path $path)
            }
          }
          foreach ($dir in $dirs | Select-Object -Unique) {
            Write-Host "granting $user read access to $dir"
            icacls $dir /grant "${user}:(OI)(CI)RX" /Q | Out-Null
          }
          $work = 'C:\psm'
          New-Item -ItemType Directory -Force $work | Out-Null
          icacls $work /grant "${user}:(OI)(CI)M" /Q | Out-Null

          $userHome = "C:\Users\$user"
          $vars = [ordered]@{}
          Get-ChildItem env: | Where-Object { $_.Name -match '^(PATH|BUNDLE_.*|STAGE_A|RAILS_ENV|GOWORK|PROSCENIUM_PNPM)$' } |
            ForEach-Object { $vars[$_.Name] = $_.Value }
          $vars['USERPROFILE'] = $userHome
          $vars['HOME'] = $userHome
          $vars['APPDATA'] = "$userHome\AppData\Roaming"
          $vars['LOCALAPPDATA'] = "$userHome\AppData\Local"
          $vars['TEMP'] = "$userHome\AppData\Local\Temp"
          $vars['TMP'] = "$userHome\AppData\Local\Temp"
          $vars['TMPDIR'] = "$userHome\AppData\Local\Temp"
          $lines = @('@echo off', 'chcp 65001 >nul')
          $lines += $vars.GetEnumerator() | ForEach-Object { "set `"$($_.Key)=$($_.Value)`"" }
          $lines += @(
            # The runner's global Git settings are its own user's; this user needs them too.
            'git config --global core.symlinks true',
            'git config --global core.longpaths true',
            'git config --global core.autocrlf false',
            # System32's whoami: MSYS's, earlier on PATH, takes no /groups.
            "$env:SystemRoot\System32\whoami.exe /groups",
            "$env:SystemRoot\System32\whoami.exe /groups | findstr /C:`"S-1-5-32-544`" && (echo still an administrator & exit /b 98)",
            "mklink $work\probe-link $work\launch.cmd >nul 2>&1 && (echo can create symbolic links & exit /b 99)",
            'echo no administrator group, no symbolic link privilege',
            "cd /d `"$env:GITHUB_WORKSPACE`"",
            'ruby bin\test -v test\cli\install_test.rb',
            'exit /b %ERRORLEVEL%'
          )
          Set-Content -Encoding utf8 "$work\launch.cmd" $lines

          Start-Service seclogon -ErrorAction SilentlyContinue
          $credential = [pscredential]::new($user, (ConvertTo-SecureString $password -AsPlainText -Force))
          # With -Credential, Start-Process does not search PATH: it needs the full path.
          $process = Start-Process "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/c', "$work\launch.cmd" -Credential $credential `
            -LoadUserProfile -WorkingDirectory $work -PassThru `
            -RedirectStandardOutput "$work\out.log" -RedirectStandardError "$work\err.log"
          if (-not $process.WaitForExit(1200000)) { $process.Kill($true); Write-Error 'timed out' }
          Get-Content "$work\out.log", "$work\err.log"
          if ($process.ExitCode -ne 0) { Write-Error "exit $($process.ExitCode)" }

  # #154's C48: the first run as a new user meets it, from `rails new -j bun` on. Generates an app
  # and installs its gems from the network, so it runs on its own.
  first-run:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
      FIRST_RUN: 1
    steps:
      - name: Windows checkout needs symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Bun version from the capability table
        id: caps
        shell: bash
        run: echo "bun=$(jq -r '.managers.bun.lines[0].ci' lib/proscenium/cli/capabilities.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.caps.outputs.bun }}

      - if: runner.os != 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go
      - if: runner.os == 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium.dll main.go
      - run: bin/test -v test/first_run_test.rb
        shell: bash

  bun-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
    steps:
      # See the note in go-test: the fixture symlinks do not survive a default Windows checkout.
      - name: Windows checkout needs symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v7

        with:

          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Pinned, so a Bun release cannot change what this job tests. The harness leans on measured
      # plugin behaviour, so the version matters more than usual.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - if: runner.os != 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go
      - if: runner.os == 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium.dll main.go

      # fixtures/dummy's node_modules is committed as test data: the resolver tests depend on its
      # exact tree (see go-test). Its @rubygems/* packages are dependency-only tarballs under
      # vendor/legacy, the layout an app that installed a gem through the old registry still has.
      - run: bun test test/js/
        shell: bash
        working-directory: fixtures/dummy

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop -P --fail-level C

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      # Pinned for the same reason bun is: a golangci-lint release can add a check or change one,
      # and a branch nobody touched should not go red because upstream shipped. The action verifies
      # .golangci.yml against its schema before running, so a config the local binary accepts but
      # this version does not fails here rather than silently linting nothing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

name: main
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - run: go test ./test

  ruby-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rails: [rails-7.1, rails-7.2, rails-8, rails-8.1]
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go
      - run: bundle exec appraisal install
      - run: bundle exec appraisal ${{ matrix.rails }} bin/test

  bun-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Pinned, so a Bun release cannot change what this job tests. The harness leans on measured
      # plugin behaviour, so the version matters more than usual.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go

      # fixtures/dummy's node_modules is committed, because its @rubygems/* dependencies are
      # served by the app's own registry and a clean install would need it running.
      - run: bun test test/js/
        working-directory: fixtures/dummy

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop -P --fail-level C

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      # Pinned for the same reason bun is: a golangci-lint release can add a check or change one,
      # and a branch nobody touched should not go red because upstream shipped. The action verifies
      # .golangci.yml against its schema before running, so a config the local binary accepts but
      # this version does not fails here rather than silently linting nothing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

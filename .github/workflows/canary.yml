name: canary

# #154's nightly canary: the package-manager suites against the newest patch of every supported
# manager line, where PR CI pins each line's floor from lib/proscenium/cli/capabilities.json. A
# failure here is a new manager release changing what contexts rely on, found before a user does.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  # A change to the canary itself is checked on its pull request: a workflow cannot be dispatched
  # by hand until it is on the default branch.
  pull_request:
    paths: ['.github/workflows/canary.yml']

permissions:
  contents: read

jobs:
  newest-patch:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pnpm: ['11', '12']
    runs-on: ${{ matrix.os }}
    env:
      RAILS_ENV: test
      GOWORK: off
      STAGE_A: 1
    steps:
      - name: Windows checkout needs symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The newest patch of this pnpm line and of Bun's one supported line, from the registry.
      - name: Newest patches
        id: newest
        shell: bash
        run: |
          pnpm=$(npm view "pnpm@${{ matrix.pnpm }}" version --json | jq -r 'if type == "array" then .[-1] else . end')
          bun=$(npm view "bun@1.4" version --json | jq -r 'if type == "array" then .[-1] else . end')
          echo "pnpm=$pnpm" >> "$GITHUB_OUTPUT"
          echo "bun=$bun" >> "$GITHUB_OUTPUT"
          echo "Testing pnpm $pnpm and Bun $bun"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.newest.outputs.pnpm }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.newest.outputs.bun }}

      - if: runner.os != 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium main.go
      - if: runner.os == 'Windows'
        run: go build -mod=readonly -buildmode=c-shared -o lib/proscenium/ext/proscenium.dll main.go

      - run: bin/test -v test/cli/git_scripts_test.rb test/bun_layout_test.rb test/pnpm_layout_test.rb test/cli/install_test.rb test/cli/spec_kinds_test.rb
        shell: bash
        env:
          PROSCENIUM_PNPM: ${{ steps.newest.outputs.pnpm }}

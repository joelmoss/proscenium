name: audit
# Temporary: proves govulncheck fails on Go 1.27.1. Never merge.

# Advisories arrive without a commit here, so nothing on a push would notice one. Dependabot's
# alerts only ever came from Gemfile.lock and go.mod, which left the Appraisal locks and the Go
# toolchain unwatched. A red run means an advisory, not a broken branch.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  # As in canary.yml: a workflow cannot be dispatched by hand until it is on the default branch.
  pull_request:
    paths: ['.github/workflows/audit.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundler-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: bundle exec bundle-audit update

      # Every lock CI installs, all of them even after one fails. The Gemfile.locks of the fixture
      # gems are left out: nothing installs them, and they are frozen on Rails 7.0.4 as test data.
      - name: Audit the lockfiles
        run: |
          status=0
          for lock in Gemfile.lock gemfiles/*.lock fixtures/adopted/Gemfile.lock; do
            echo "Auditing $lock"
            bundle exec bundle-audit check --gemfile-lock "$lock" || status=1
          done
          exit "$status"

  govulncheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # From go.mod, the same Go the release builds with, so this reports the standard library the
      # published gems carry and not whatever is newest.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Not `.`: main() is empty and the library is entered through cgo exports, which govulncheck
      # does not treat as roots, so it would trace nothing and pass. Every exported function under
      # internal/ is a root. Not `./...` either, which would add the test helpers' dependencies.
      - run: govulncheck ./internal/...

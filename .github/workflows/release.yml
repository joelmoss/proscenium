# Releases used to run from a laptop: `rake build && rake push`, one RubyGems one-time code per
# gem, with Docker needed locally for the cross-compiled Linux gems. That is five prompts today
# and grows with every platform, and a run that died partway left the version half-published -
# see the comment above `push:gem` in the Rakefile for the time that happened.
#
# This workflow removes the one-time codes (trusted publishing, OIDC) and, more importantly,
# refuses to publish anything until the gems it just built have been resolved and installed the
# way a user would get them. `gem push` is idempotent here, so a failed run is finished by
# re-running it rather than by pushing the remainder by hand.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify, but do not publish
        type: boolean
        default: true

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  # The platform list lives in the Rakefile and nowhere else. Both build jobs filter this, so
  # adding a platform there is the only edit a new platform needs.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.split.outputs.darwin }}
      linux: ${{ steps.split.outputs.linux }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - id: split
        run: |
          all=$(bundle exec rake platforms:json | tail -1)
          echo "darwin=$(jq -c '[.[] | select(test("darwin"))]' <<<"$all")" >> "$GITHUB_OUTPUT"
          echo "linux=$(jq -c '[.[] | select(test("darwin") | not)]' <<<"$all")" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "version=$(ruby -Ilib -rproscenium/version -e 'print Proscenium::VERSION')" >> "$GITHUB_OUTPUT"
      - name: Tag must match the gem version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [ "$tag" = "${{ steps.version.outputs.version }}" ] || {
            echo "tag $GITHUB_REF_NAME does not match VERSION ${{ steps.version.outputs.version }}" >&2
            exit 1
          }

  build-darwin:
    needs: platforms
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.darwin) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake "build:${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  build-linux:
    needs: platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # xgo builds the glibc gems in a container. The musl gems build in a container too, but a
      # different one - see the compile task in the Rakefile.
      - run: go install src.techknowlogick.com/xgo@latest
      # Emulation for any target whose architecture is not this runner's. Cheap when unused.
      - uses: docker/setup-qemu-action@v3
      - run: bundle exec rake "build:${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  # The platform-less gem, built in a job that never compiles anything.
  #
  # That is the whole fix for the 0.25.2 bug, where the published plain gem carried an x86-64
  # Linux library. Locally, `rake build` runs the platform compiles first and Bundler's plain-gem
  # action last, in one working tree, so whatever the last compile left in lib/proscenium/ext/
  # got packed. Here nothing has ever written to that directory, so there is nothing to inherit.
  # The assertion below is the guard, not the fix - it fails loudly if that ever stops being true.
  build-plain:
    needs: platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: |
          mkdir -p pkg
          gem build proscenium.gemspec -o "pkg/proscenium-${{ needs.platforms.outputs.version }}.gem"
      - name: The plain gem must carry no compiled library
        run: |
          tar -xOf "pkg/proscenium-${{ needs.platforms.outputs.version }}.gem" data.tar.gz \
            | tar -tzf - > /tmp/plain-contents.txt
          if grep -q '^lib/proscenium/ext/' /tmp/plain-contents.txt; then
            echo "::error::the platform-less gem contains lib/proscenium/ext/ - it would ship a binary for the wrong platform"
            grep '^lib/proscenium/ext/' /tmp/plain-contents.txt
            exit 1
          fi
          echo "ok: no lib/proscenium/ext/ entries"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-plain
          path: pkg/*.gem
          if-no-files-found: error

  # Nothing publishes until a real archive has been resolved and installed the way a user gets
  # it. Checking the gemspec's file list cannot see a stray binary left on disk between two rake
  # tasks, which is exactly how 0.25.2 shipped an x86-64 Linux library inside the plain gem.
  # Nothing publishes until a real archive has been resolved and installed the way a user gets
  # it. Checking the gemspec's file list cannot see a stray binary left on disk between two rake
  # tasks, which is exactly how 0.25.2 shipped an x86-64 Linux library inside the plain gem.
  #
  # glibc only for now. The musl leg arrives with the musl gems: today a musl host resolves the
  # bare `x86_64-linux` gem and fails to load it, which is the bug those gems exist to fix, and a
  # permanently red job here would block every release until then.
  verify:
    needs: [platforms, build-darwin, build-linux, build-plain]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ruby:3.3
            expect: x86_64-linux
    steps:
      - uses: actions/checkout@v7
      # The gems land in index/gems/ because that is the layout `gem generate_index` expects:
      # it indexes <dir>/gems/*.gem and writes the metadata beside it. Pointed at a flat
      # directory it reports success and produces an index listing nothing, and `gem install`
      # then says "Could not find a valid gem" - which reads like a resolution bug rather than a
      # layout mistake.
      - uses: actions/download-artifact@v4
        with:
          path: index/gems
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # A real index, so `gem install` performs real platform selection. Installing the .gem file
      # directly would bypass the one thing this job exists to test.
      - name: Serve the built gems from a local index
        run: |
          gem install rubygems-generate_index --no-document
          gem generate_index -d index
          test -s index/info/proscenium || { echo "::error::index is empty - check the gems/ layout"; exit 1; }
          nohup python3 -m http.server 8808 --directory index >/tmp/index.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8808/versions >/dev/null && exit 0
            sleep 1
          done
          echo "::error::local gem index never came up"; cat /tmp/index.log; exit 1
      - run: bin/verify-gem "${{ matrix.image }}" "${{ needs.platforms.outputs.version }}" "${{ matrix.expect }}"

  publish:
    needs: [platforms, verify]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Pinned for the reason bun and golangci-lint are: a release of this action should not be
      # able to change how we authenticate to RubyGems without anybody deciding to.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      # `rake push` skips any gem RubyGems already has at this version, so re-running a failed
      # release finishes it instead of failing on everything that already went up.
      - run: bundle exec rake push
